<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAAAA</title>

<head>

  <style>
    .box {
      background-image: url("test.jpg");
      background-size: cover;
      background-position: center;

      padding: 20px;
      width: 350px;
      margin: 50px auto;

      color: yellow;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="box">
  
    <h2>Information</h2>
    <form>

        <div>
            <label for="User Name">User Name</label>
            <input required id="User Name" type="text" placeholder="Enter User Name">
        </div>
        <br>

        <div>
            <label for="Email">Email</label>
            <input required id="Email" type="email" placeholder="Enter your email">
        </div>

        <br>

        <div>
            <label for="Password">Password</label>
            <input required id="Password" type="password" placeholder="Enter password">
        </div>

        <br>

        <input type="submit" value="تحميل">

    </form>
</body>
